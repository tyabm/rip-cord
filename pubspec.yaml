name: rip_cord
description: Operant-conditioning habit interruption tool — pull the Rip-Cord to interrupt phone-checking urges.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  flutter_tts: ^4.2.2
  intl: ^0.20.2
  uuid: ^4.5.1
  audioplayers: ^6.5.0
  url_launcher: ^6.3.1
  android_intent_plus: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/breath_chime.wav
